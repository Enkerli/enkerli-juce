# Reusable cross-platform build for an enkerli-juce plugin. Each plugin repo
# calls it from a thin caller workflow:
#
#   jobs:
#     build:
#       uses: Enkerli/enkerli-juce/.github/workflows/build-plugin.yml@main
#
# It builds every version the archetype emits — macOS AU/VST3/CLAP, Windows
# VST3/CLAP, Linux LV2/CLAP (+ Standalone everywhere), and an unsigned iOS
# AUv3/Standalone compile — proving the whole matrix builds. The WebUI source
# lives in the music-suite monorepo, checked out as a sibling and its deps
# installed (esbuild bundles it during the CMake build). JUCE is fetched (or a
# vendored copy is used); enkerli-juce is the one submodule.
name: build-plugin

on:
  workflow_call:
    inputs:
      music-suite-ref:
        description: Branch/ref of Enkerli/music-suite to source the WebUI from.
        type: string
        default: main
      prebuild:
        description: >-
          Optional shell command run in the plugin dir before CMake (e.g. a
          plugin that regenerates its WebUI via a node script instead of the
          CMake esbuild step).
        type: string
        default: ""
      cmake-args:
        description: Extra args appended to the CMake configure step.
        type: string
        default: ""
      pluginval:
        description: >-
          Run pluginval against the built VST3 on the Windows and Linux legs.
          Opt-in (default false) because turning it on repo-wide would fail six
          other pipelines before anyone had looked at why. macOS keeps auval as
          its rung; this covers the two platforms nothing else touches.
        type: boolean
        default: false
      ios:
        description: >-
          Build the unsigned iOS leg. Default true, which is the historical
          behaviour. Set false in repos whose iOS builds are done by hand in
          Xcode -- the leg costs a macOS runner and roughly doubles the wall
          clock of a cold run for a check they are not relying on.
        type: boolean
        default: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Built from an expression so the iOS leg can be dropped entirely rather
        # than started and skipped: a matrix `exclude` cannot read an input, and
        # an `if` on the job still spins up the runner.
        #
        # iOS shares the macOS runner; ios=true switches to the Xcode generator
        # and an unsigned build (device signing is out of CI scope).
        include: >-
          ${{ fromJSON(inputs.ios
            && '[{"os":"macos-latest","name":"macOS"},{"os":"ubuntu-latest","name":"Linux"},{"os":"windows-latest","name":"Windows"},{"os":"macos-latest","name":"iOS","ios":true}]'
            || '[{"os":"macos-latest","name":"macOS"},{"os":"ubuntu-latest","name":"Linux"},{"os":"windows-latest","name":"Windows"}]') }}
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: plugin

      # The WebUI source. The plugin CMake reads ../music-suite/apps/<app>, so
      # music-suite must sit next to the plugin checkout.
      - name: Checkout music-suite (WebUI source)
        uses: actions/checkout@v4
        with:
          repository: Enkerli/music-suite
          ref: ${{ inputs.music-suite-ref }}
          path: music-suite

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install WebUI deps
        working-directory: music-suite
        run: npm ci

      # The CMake WebUI step calls `npx esbuild` from the build dir, which won't
      # find music-suite's local copy — install it globally so it's on PATH.
      - name: Provide esbuild globally
        run: npm install -g esbuild

      - name: Linux build dependencies (JUCE + WebKitGTK + xvfb)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev xvfb

      # Compiler cache. macOS and Linux both configure with the Makefile
      # generator (juceaide + the plugin build), which honours the compiler
      # launcher — install ccache on every desktop leg so the launcher resolves
      # (Windows' MSBuild ignores the launcher, but ccache must still exist or
      # the flag hits "command not found"). The iOS leg uses the Xcode generator
      # and sets no launcher.
      - name: ccache
        if: ${{ !matrix.ios }}
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.event.repository.name }}-${{ matrix.name }}

      - name: Prebuild
        if: inputs.prebuild != ''
        working-directory: plugin
        run: ${{ inputs.prebuild }}

      # ── Configure ──
      - name: Configure (desktop)
        if: ${{ !matrix.ios }}
        working-directory: plugin
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ${{ inputs.cmake-args }}

      - name: Configure (iOS)
        if: matrix.ios
        working-directory: plugin
        run: >-
          cmake -B build -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0
          ${{ inputs.cmake-args }}

      # ── Build ──
      # Linux: JUCE's LV2 post-link step loads the .so to generate the .ttl
      # manifest, which inits GTK and needs a display — run it under xvfb.
      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: plugin
        run: xvfb-run -a cmake --build build --config Release --parallel 3

      - name: Build (macOS / Windows)
        if: ${{ matrix.os != 'ubuntu-latest' && !matrix.ios }}
        working-directory: plugin
        run: cmake --build build --config Release --parallel 3

      # iOS: build unsigned (no provisioning in CI) — proves it compiles.
      - name: Build (iOS, unsigned)
        if: matrix.ios
        working-directory: plugin
        run: >-
          cmake --build build --config Release --
          -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      # ── pluginval: the only thing that opens these builds ──────────────────
      # Compiling a Windows or Linux plugin proves nothing about whether a host
      # can load it. pluginval instantiates it, runs audio through it, opens and
      # closes the editor, and abuses the lifecycle — the checks nobody performs
      # by hand on a platform they do not own.
      #
      # VST3 only: pluginval does not speak CLAP or LV2. GUI tests are NOT
      # skipped, which is the point here — the UI is a WebView, and whether it
      # comes up under WebKitGTK or WebView2 is the open question these builds
      # carry. Linux runs it under xvfb, as the LV2 manifest step already does.
      - name: Fetch pluginval (Linux)
        if: ${{ inputs.pluginval && matrix.os == 'ubuntu-latest' }}
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip && chmod +x pluginval

      - name: Fetch pluginval (Windows)
        if: ${{ inputs.pluginval && matrix.os == 'windows-latest' }}
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          unzip -q pluginval.zip
        shell: bash

      - name: pluginval (Linux)
        if: ${{ inputs.pluginval && matrix.os == 'ubuntu-latest' }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          found=0
          for vst3 in plugin/build/**/Release/VST3/*.vst3; do
            found=1
            echo "== $vst3"
            xvfb-run -a ./pluginval --strictness-level 8 --validate-in-process --timeout-ms 120000 "$vst3"
          done
          # A silent pass because the glob matched nothing would be worse than a
          # failure: it reads as "validated".
          [ "$found" = 1 ] || { echo "no VST3 found to validate"; exit 1; }

      - name: pluginval (Windows)
        if: ${{ inputs.pluginval && matrix.os == 'windows-latest' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          found=0
          for vst3 in plugin/build/**/Release/VST3/*.vst3; do
            found=1
            echo "== $vst3"
            ./pluginval.exe --strictness-level 8 --validate-in-process --timeout-ms 120000 "$vst3"
          done
          [ "$found" = 1 ] || { echo "no VST3 found to validate"; exit 1; }

      - name: Collect artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.name }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            plugin/build/**/*_artefacts/**/*.vst3
            plugin/build/**/*_artefacts/**/*.component
            plugin/build/**/*_artefacts/**/*.clap
            plugin/build/**/*_artefacts/**/*.lv2
            plugin/build/**/*_artefacts/**/*.app
            plugin/build/**/*_artefacts/**/*.appex
            plugin/build/**/*_artefacts/**/*.exe
